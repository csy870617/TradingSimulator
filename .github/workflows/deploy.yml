name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * 0' # weekly refresh of the bundled price data (Sunday 21:17 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to see the automatic branch build (see the deploy job)

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs so that a retry of the deploy step never
  # re-uploads the artifact. When both ran in one job, a transient Pages backend
  # error caused a retry that produced a second "github-pages" artifact, and
  # deploy-pages then failed with "Multiple artifacts named github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Restore price data cache
        uses: actions/cache@v4
        with:
          path: data
          key: price-data-${{ github.run_id }}
          restore-keys: price-data-
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Real charts are served from the site itself (data/*.json) instead of
      # public CORS proxies. A failed download never blocks the deploy: the
      # page falls back to the proxies / a synthetic chart for missing stocks.
      - name: Download price data
        continue-on-error: true
        run: node scripts/fetch-data.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The repository's Pages source is "Deploy from a branch", so GitHub also
      # runs its own "pages build and deployment" on every push. That build has
      # no price data; whichever deploy finishes last wins, so wait for it and
      # deploy after it.
      - name: Wait for the automatic branch build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
                 --jq '[.workflow_runs[] | select(.name=="pages build and deployment" and .status!="completed")] | length' || echo 0)
            [ "$n" = "0" ] && exit 0
            echo "automatic Pages build still running ($n); waiting..."
            sleep 15
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
